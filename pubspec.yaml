name: vstech_hrm
description: "vstech-hrm Employee Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Domain Layer (Pure Dart)
  fpdart: ^1.1.0
  equatable: ^3.0.0

  # Data Layer
  dio: ^5.4.0
  retrofit: ^4.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.2

  # Presentation Layer
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  formz: ^0.8.1
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2700.0

  # Core, Security & Device Capabilities
  get_it: ^9.3.0
  flutter_dotenv: ^6.0.1
  logger: ^2.0.2
  pretty_dio_logger: ^1.3.1
  local_auth: ^3.0.2
  camera: ^0.12.1
  geolocator: ^14.0.3
  network_info_plus: ^8.2.1
  permission_handler: ^11.3.1
  screen_protector: ^1.4.0
  safe_device: ^1.1.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  build_runner: ^2.4.9
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.11
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/mock/
